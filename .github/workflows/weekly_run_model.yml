name: Weekly AQI Model Retraining

on:

  # ==========================================
  # Run once every week
  # Sunday at 05:00 AM Pakistan time
  # ==========================================
  schedule:
    - cron: "0 0 * * 0"

  # ==========================================
  # Allows manual execution from GitHub
  # ==========================================
  workflow_dispatch:


jobs:

  retrain-models:

    runs-on: ubuntu-latest

    timeout-minutes: 60


    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================
      # 2. Setup Python 3.11
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # 3. Upgrade pip
      # ==========================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # ==========================================
      # 4. Install project dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ==========================================
      # 5. Verify Python environment
      # ==========================================
      - name: Verify environment
        run: |
          python --version
          pip --version

          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import xgboost; print('xgboost:', xgboost.__version__)"
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import hopsworks; print('hopsworks:', hopsworks.__version__)"


      # ==========================================
      # 6. Verify Hopsworks API key
      # ==========================================
      - name: Verify Hopsworks secret
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

        run: |

          if [ -z "$HOPSWORKS_API_KEY" ]; then
            echo "ERROR: HOPSWORKS_API_KEY is not configured."
            exit 1
          fi

          echo "HOPSWORKS_API_KEY is configured."


      # ==========================================
      # 7. Run model retraining
      # ==========================================
      - name: Train and register AQI models
        env:

          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

        run: |

          echo "=========================================="
          echo "STARTING WEEKLY AQI MODEL RETRAINING"
          echo "=========================================="

          echo ""
          echo "UTC time:"
          date -u

          echo ""
          echo "Running XGBoost training..."

          python src/ci_cd/xgboost_model_registry.py

          echo ""
          echo "=========================================="
          echo "WEEKLY AQI MODEL RETRAINING COMPLETED"
          echo "=========================================="