name: Hourly AQI Update

on:

  # Run automatically every hour.
  # 17 minutes past the hour to avoid the busiest minute.
  schedule:
    - cron: "17 * * * *"

  # Allows manual execution from GitHub.
  workflow_dispatch:


jobs:

  update-aqi:

    runs-on: ubuntu-latest

    timeout-minutes: 20


    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================
      # 2. Setup Python 3.11
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # 3. Upgrade pip
      # ==========================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # ==========================================
      # 4. Install project dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ==========================================
      # 5. Verify Python environment
      # ==========================================

      - name: Verify environment
        run: |
          python --version
          pip --version

          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import hopsworks; print('hopsworks:', hopsworks.__version__)"


      # ==========================================
      # 6. Run AQI pipeline
      # ==========================================

      - name: Run hourly AQI pipeline
        env:

          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}

          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

        run: |

          echo "=========================================="
          echo "STARTING HOURLY AQI PIPELINE"
          echo "=========================================="

          echo "UTC time:"
          date -u

          echo ""
          echo "Running datafetch.py..."

          python src/ci_cd/datafetch.py

          echo ""
          echo "=========================================="
          echo "AQI PIPELINE COMPLETED"
          echo "=========================================="